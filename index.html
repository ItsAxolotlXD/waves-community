<!doctype html>
<html lang="vi" class="light-mode">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('waves_system_settings');
          var legacy = localStorage.getItem('waves_theme');
          var theme = 'light';
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed.theme) theme = parsed.theme;
          } else if (legacy) {
            theme = legacy;
          }
          if (theme === 'dark') {
            document.documentElement.classList.remove('light-mode');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.add('light-mode');
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('light-mode');
        }
      })();
    </script>
    <title>Waves Community — Nền tảng Truyền hình Việt Nam</title>
    <meta name="description" content="Cộng đồng dành cho người yêu thích, theo dõi và lưu trữ nội dung truyền hình Việt Nam." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
    <meta property="og:title" content="Waves Community — Nền tảng Truyền hình Việt Nam" />
    <meta property="og:description" content="Nền tảng cộng đồng dành cho những người yêu thích, theo dõi và lưu trữ nội dung truyền hình Việt Nam." />
    <meta property="og:type" content="website" />
  </head>
  <body class="bg-[#141416] text-[#F3F4F6] antialiased selection:bg-[#C83DFF] selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
